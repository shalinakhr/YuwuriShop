<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Keranjang — Yuwuri Shop</title>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.serif{font-family:'Playfair Display',serif}</style></head>
<body class="min-h-screen bg-[#FDFBF7] text-[#391E10]">
<header class="bg-white border-b border-[#E3CEB1] px-5 py-4"><div class="max-w-5xl mx-auto flex justify-between items-center"><a href="catalog.html" class="serif text-2xl font-bold">Yuwuri<span class="italic font-normal text-[#734128]">.shop</span></a><a href="catalog.html" class="text-sm underline">Lanjut belanja</a></div></header>
<main class="max-w-5xl mx-auto p-5 sm:p-8"><h1 class="serif text-3xl font-bold">Keranjang Belanja</h1><p class="text-sm text-[#734128] mt-2">Periksa kembali produk pilihanmu sebelum checkout.</p>
<div id="cartItems" class="mt-7 space-y-3"></div>
<section class="mt-7 ml-auto max-w-md bg-white border border-[#E3CEB1] rounded-2xl p-5"><div class="flex justify-between text-sm"><span>Subtotal</span><b id="subtotal">Rp0</b></div><p id="checkoutMessage" class="text-sm mt-3"></p><button id="checkoutBtn" class="mt-4 w-full bg-[#391E10] text-white rounded-xl py-3 font-bold">Lanjut Checkout</button></section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://jrsooxmoljjqtgjmkumz.supabase.co','sb_publishable_scpzlZ7fozc6EogEkZTTYA_rsB5cF4M');
const $=id=>document.getElementById(id);
let cart=JSON.parse(localStorage.getItem('yuwuri_cart')||'[]');
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function save(){localStorage.setItem('yuwuri_cart',JSON.stringify(cart));render();}
function render(){
 $('cartItems').innerHTML=cart.length?cart.map((p,i)=>`<div class="bg-white border border-[#E3CEB1] rounded-xl p-4 flex items-center gap-3"><div class="flex-1 min-w-0"><b class="block truncate">${String(p.name||'Produk').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</b><span class="text-xs text-[#734128]">${money(p.price)}</span></div><button data-minus="${i}" class="border rounded-lg px-3 py-1">−</button><span>${p.quantity||1}</span><button data-plus="${i}" class="border rounded-lg px-3 py-1">+</button><button data-remove="${i}" class="text-red-600 ml-2" aria-label="Hapus">×</button></div>`).join(''):'<div class="bg-white border border-[#E3CEB1] rounded-xl p-8 text-center text-sm">Keranjangmu masih kosong.</div>';
 $('subtotal').textContent=money(cart.reduce((sum,p)=>sum+(Number(p.price)||0)*(Number(p.quantity)||1),0));
 document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let i=+b.dataset.minus;cart[i].quantity=Math.max(1,(cart[i].quantity||1)-1);save();});
 document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{let i=+b.dataset.plus;cart[i].quantity=(cart[i].quantity||1)+1;save();});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save();});
 $('checkoutBtn').disabled=!cart.length;$('checkoutBtn').classList.toggle('opacity-50',!cart.length);
}
$('checkoutBtn').addEventListener('click',async()=>{
 const {data:{session},error}=await supabase.auth.getSession();
 if(error){$('checkoutMessage').textContent='Tidak dapat memeriksa login: '+error.message;return;}
 if(!session){location.href='login.html?next=cart.html&action=checkout';return;}
 $('checkoutMessage').textContent='Kamu sudah login sebagai '+(session.user.email||'customer')+'. Tahap berikutnya adalah menghubungkan formulir alamat, pengiriman, dan pembayaran.';
});
render();
</script></body></html>
