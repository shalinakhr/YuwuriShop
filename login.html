<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar — Yuwuri Shop</title>

  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K9WG4VMC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/yuwuri.css">
</head>
<body>

  <main>
    <div class="yw-auth">
      <a href="index.html" class="yw-logo">Yuwuri<span>.shop</span></a>
      <p class="yw-tiny" style="margin-top:.6rem">Selamat datang di Yuwuri Shop</p>

      <div class="yw-auth-tabs" role="tablist">
        <button type="button" id="loginTab" class="is-active" role="tab">Masuk</button>
        <button type="button" id="signupTab" role="tab">Buat akun</button>
      </div>

      <form id="authForm" style="margin-top:1.5rem;display:grid;gap:1rem">
        <div id="nameWrap" class="yw-field hidden">
          <label for="fullName">Nama lengkap</label>
          <input id="fullName" type="text" autocomplete="name" class="yw-input" placeholder="Nama kamu">
        </div>
        <div class="yw-field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" class="yw-input" placeholder="nama@email.com">
        </div>
        <div class="yw-field">
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="6" autocomplete="current-password" class="yw-input" placeholder="Minimal 6 karakter">
        </div>
        <button id="submitBtn" class="yw-btn" style="width:100%;margin-top:.35rem">Masuk</button>
      </form>

      <p id="message" role="status" style="margin-top:1rem;font-size:12.5px;line-height:1.6"></p>

      <div style="margin-top:1.75rem;border-top:1px solid var(--line);padding-top:1.25rem">
        <p class="yw-tiny">Customer dapat melihat katalog tanpa login. Login diperlukan saat akan checkout.</p>
        <a href="catalog.html" class="yw-tiny" style="display:inline-block;margin-top:.75rem;color:var(--ink);border-bottom:1px solid var(--ink)">Lanjut lihat katalog</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://jrsooxmoljjqtgjmkumz.supabase.co', 'sb_publishable_scpzlZ7fozc6EogEkZTTYA_rsB5cF4M');
    const $ = id => document.getElementById(id);
    let mode = 'login';
    const params = new URLSearchParams(location.search);
    const requestedNext = params.get('next') || 'index.html';
    const allowedNext = /^(index|catalog|cart|checkout|payment|admin)\.html(#[a-z]+)?$/.test(requestedNext) ? requestedNext : 'index.html';
    const verifyRedirectUrl = new URL('verify.html', window.location.href).href;

    function message(text, error = false) {
      $('message').textContent = text;
      $('message').style.color = error ? 'var(--danger)' : 'var(--ok)';
    }

    function setMode(next) {
      mode = next;
      $('loginTab').classList.toggle('is-active', next === 'login');
      $('signupTab').classList.toggle('is-active', next === 'signup');
      $('nameWrap').classList.toggle('hidden', next !== 'signup');
      $('fullName').required = next === 'signup';
      $('password').autocomplete = next === 'signup' ? 'new-password' : 'current-password';
      $('submitBtn').textContent = next === 'signup' ? 'Buat Akun' : 'Masuk';
      message('');
    }

    async function routeByRole(user) {
      const { data: admin, error } = await supabase.from('admin_users').select('user_id').eq('user_id', user.id).maybeSingle();
      if (error) { message('Login berhasil, tetapi role belum dapat diverifikasi. Periksa policy SELECT pada admin_users: ' + error.message, true); return; }
      if (admin) { location.replace('admin.html'); return; }
      location.replace(allowedNext);
    }

    $('loginTab').addEventListener('click', () => setMode('login'));
    $('signupTab').addEventListener('click', () => setMode('signup'));

    $('authForm').addEventListener('submit', async e => {
      e.preventDefault();
      $('submitBtn').disabled = true;
      $('submitBtn').textContent = 'Memproses...';
      message('');
      const email = $('email').value.trim(), password = $('password').value;

      if (mode === 'signup') {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: verifyRedirectUrl,
            data: { full_name: $('fullName').value.trim(), role: 'customer' }
          }
        });
        if (error) message(error.message, true);
        else if (data.session && data.user) { message('Akun berhasil dibuat. Mengarahkan ke toko...'); await routeByRole(data.user); }
        else message('Pendaftaran berhasil! Silakan cek kotak masuk atau folder spam email kamu dan klik tombol verifikasi.');
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          if (error.message.includes('Email not confirmed')) {
            message('Email belum diverifikasi. Silakan cek email kamu dan klik tautan konfirmasi terlebih dahulu.', true);
          } else {
            message(error.message, true);
          }
        } else if (data.user) {
          await routeByRole(data.user);
        }
      }
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = mode === 'signup' ? 'Buat Akun' : 'Masuk';
    });

    const { data: { session } } = await supabase.auth.getSession();
    if (session) await routeByRole(session.user);
    if (params.get('error') === 'not-admin') message('Akun ini bukan admin. Kamu tetap bisa menggunakan akun sebagai customer.', true);
  </script>
</body>
</html>
