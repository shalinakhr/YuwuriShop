<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk / Daftar — Yuwuri Shop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif}.serif{font-family:'Playfair Display',serif}
</style>
</head>
<body class="min-h-screen bg-[#FDFBF7] text-[#391E10] flex items-center justify-center p-4">
<main class="w-full max-w-lg bg-white border border-[#E3CEB1] rounded-[2rem] shadow-sm p-7 sm:p-10">
  <a href="index.html" class="serif text-4xl sm:text-5xl font-bold tracking-tight">Yuwuri<span class="italic font-normal text-[#734128]">.shop</span></a>
  <p class="mt-3 text-[#734128]">Selamat datang di Yuwuri Shop</p>
  <div class="mt-7 grid grid-cols-2 rounded-xl bg-[#F7F3ED] p-1 text-sm font-semibold">
    <button id="loginTab" class="rounded-lg bg-[#391E10] text-white py-3">Masuk</button>
    <button id="signupTab" class="rounded-lg text-[#734128] py-3">Buat akun</button>
  </div>
  <form id="authForm" class="mt-6 space-y-4">
    <div id="nameWrap" class="hidden">
      <label for="fullName" class="block text-sm font-semibold mb-2">Nama lengkap</label>
      <input id="fullName" type="text" autocomplete="name" class="w-full rounded-xl border border-[#E3CEB1] bg-[#FDFBF7] px-4 py-3 outline-none focus:ring-2 focus:ring-[#C7A07A]" placeholder="Nama kamu">
    </div>
    <div>
      <label for="email" class="block text-sm font-semibold mb-2">Email</label>
      <input id="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-[#E3CEB1] bg-[#FDFBF7] px-4 py-3 outline-none focus:ring-2 focus:ring-[#C7A07A]" placeholder="nama@email.com">
    </div>
    <div>
      <label for="password" class="block text-sm font-semibold mb-2">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" class="w-full rounded-xl border border-[#E3CEB1] bg-[#FDFBF7] px-4 py-3 outline-none focus:ring-2 focus:ring-[#C7A07A]" placeholder="Minimal 6 karakter">
    </div>
    <button id="submitBtn" class="w-full rounded-xl bg-[#391E10] text-white py-4 font-bold hover:bg-[#734128] transition">Masuk</button>
  </form>
  <p id="message" class="mt-4 text-sm leading-relaxed" role="status"></p>
  <div class="mt-7 border-t border-[#F7F3ED] pt-5 text-xs text-[#734128] leading-relaxed">
    <p>Customer dapat melihat katalog tanpa login. Login diperlukan saat akan checkout.</p>
    <a href="catalog.html" class="inline-block mt-3 font-bold underline">Lanjut lihat katalog</a>
  </div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient('https://jrsooxmoljjqtgjmkumz.supabase.co', 'sb_publishable_scpzlZ7fozc6EogEkZTTYA_rsB5cF4M');
const $ = id => document.getElementById(id);
let mode = 'login';
const params = new URLSearchParams(location.search);
const requestedNext = params.get('next') || 'index.html';
const allowedNext = /^(index|catalog|cart)\.html$/.test(requestedNext) ? requestedNext : 'index.html';
function message(text, error=false) { $('message').textContent=text; $('message').className='mt-4 text-sm leading-relaxed '+(error?'text-red-600':'text-green-700'); }
function setMode(next) {
  mode=next;
  $('loginTab').className=next==='login'?'rounded-lg bg-[#391E10] text-white py-3':'rounded-lg text-[#734128] py-3';
  $('signupTab').className=next==='signup'?'rounded-lg bg-[#391E10] text-white py-3':'rounded-lg text-[#734128] py-3';
  $('nameWrap').classList.toggle('hidden',next!=='signup');
  $('fullName').required=next==='signup';
  $('password').autocomplete=next==='signup'?'new-password':'current-password';
  $('submitBtn').textContent=next==='signup'?'Buat Akun':'Masuk';
  message('');
}
async function routeByRole(user) {
  const {data:admin,error}=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
  if(error) { message('Login berhasil, tetapi role belum dapat diverifikasi. Periksa policy SELECT pada admin_users: '+error.message,true); return; }
  if(admin) { location.replace('cms.html'); return; }
  location.replace(allowedNext);
}
$('loginTab').addEventListener('click',()=>setMode('login'));
$('signupTab').addEventListener('click',()=>setMode('signup'));
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('submitBtn').disabled=true; $('submitBtn').textContent='Memproses...'; message('');
  const email=$('email').value.trim(), password=$('password').value;
  if(mode==='signup') {
    const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim(),role:'customer'}}});
    if(error) message(error.message,true);
    else if(data.session && data.user) { message('Akun berhasil dibuat. Mengarahkan ke toko...'); await routeByRole(data.user); }
    else message('Pendaftaran berhasil. Silakan cek email untuk verifikasi, lalu masuk ke akunmu.');
  } else {
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error) message(error.message,true);
    else if(data.user) await routeByRole(data.user);
  }
  $('submitBtn').disabled=false; $('submitBtn').textContent=mode==='signup'?'Buat Akun':'Masuk';
});
const {data:{session}}=await supabase.auth.getSession();
if(session) await routeByRole(session.user);
if(params.get('error')==='not-admin') message('Akun ini bukan admin. Kamu tetap bisa menggunakan akun sebagai customer.',true);
</script>
</body></html>
